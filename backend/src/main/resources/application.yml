server:
  port: 8080

spring:
  application:
    name: pawfectly-backend

  datasource:
    # Local MySQL or a managed MySQL instance (RDS, PlanetScale, etc.) - adjust host/port/db name
    url: ${DB_URL:jdbc:mysql://localhost:3306/pawfectly?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Use 'update' while iterating on entities. Switch to 'validate' once you introduce
      # a migration tool (Flyway/Liquibase) for anything beyond local dev.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    # Generate a real secret for prod: openssl rand -base64 64
    secret: ${JWT_SECRET:replace-this-with-a-long-random-base64-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
