server:
  port: 8080

spring:
  application:
    name: pawfectly-backend

  datasource:
    # Local MySQL or a managed MySQL instance (RDS, PlanetScale, etc.) - adjust host/port/db name
    url: ${DB_URL:jdbc:mysql://localhost:3306/pawfectly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    # Generate a real secret for prod: openssl rand -base64 64
    secret: ${JWT_SECRET:replace-this-with-a-long-random-base64-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION:${JWT_EXPIRATION_MS:86400000}} # 24h

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:3001}
