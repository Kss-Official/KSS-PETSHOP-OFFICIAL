server:
  port: 8081

spring:
  application:
    name: pawfectly-backend-test

  datasource:
    url: ${DB_URL:jdbc:h2:mem:pawfectly_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: always

  flyway:
    enabled: false

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctcGF3ZmVjdGx5LWxvbmctZW5vdWdoLWZvci1oczI1Ng==
    expiration-ms: 3600000

  cors:
    allowed-origins: http://localhost:3000
