server:
  port: 8081

spring:
  application:
    name: pawfectly-backend-test

  datasource:
    url: jdbc:mysql://localhost:3306/pawfectly_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    clean-disabled: false

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctcGF3ZmVjdGx5LWxvbmctZW5vdWdoLWZvci1oczI1Ng==
    expiration-ms: 3600000

  cors:
    allowed-origins: http://localhost:3000
